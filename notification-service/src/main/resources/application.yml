server:
  port: 8082
spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.order.event,com.example.notification.event"
        spring.json.value.default.type: com.example.notification.event.OrderCreatedEvent
        spring.json.use.type.headers: false
app:
  order-service:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8081}
  kafka:
    order-created-topic: orders.created
