<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>To-Do App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .todo-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 10px;
            width: 80%;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
        }
        li {
            padding: 10px;
            margin-bottom: 10px;
            background: #f0f0f0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
        }
        .delete-button {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
<div class="todo-container">
    <h2>My To-Do List</h2>
    <form method="post" action="/webapp/add">
        <input type="text" name="description" placeholder="New task..." required/>
        <button type="submit">Add</button>
    </form>
    <ul>
        <li th:each="todo : ${todos}">
            <span th:text="${todo.description}"></span>
            <form method="post" action="/webapp/delete" th:object="${todo}">
                <input type="hidden" name="id" th:value="${todo.id}" />
                <button class="delete-button" type="submit">Delete</button>
            </form>
        </li>
    </ul>
</div>
</body>
</html>
