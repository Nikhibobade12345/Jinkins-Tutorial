
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 750px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f9;
        }

        h1 { color: #243b53; }

        form { margin: 10px 0; }

        input[type="text"] {
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 9px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .delete { background: #dc2626; }
        .todo { background: white; padding: 12px; margin: 12px 0;
                border-radius: 6px; }
        .completed { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>

<h1>My Todo Application</h1>

<form th:action="@{/webapp/add}" method="post">
    <input type="text" name="description"
           placeholder="Enter a new task" required maxlength="200">
    <button type="submit">Add Todo</button>
</form>

<p th:if="${#lists.isEmpty(todos)}">No todos yet. Add your first task!</p>

<div class="todo" th:each="todo : ${todos}">
    <span th:text="${todo.description}"
          th:classappend="${todo.completed} ? 'completed' : ''">
        Todo description
    </span>

    <form th:action="@{/webapp/toggle}" method="post">
        <input type="hidden" name="id" th:value="${todo.id}">
        <button type="submit"
                th:text="${todo.completed} ? 'Mark Pending' : 'Complete'">
            Complete
        </button>
    </form>

    <form th:action="@{/webapp/update}" method="post">
        <input type="hidden" name="id" th:value="${todo.id}">
        <input type="text" name="description"
               th:value="${todo.description}" required maxlength="200">
        <button type="submit">Update</button>
    </form>

    <form th:action="@{/webapp/delete}" method="post">
        <input type="hidden" name="id" th:value="${todo.id}">
        <button type="submit" class="delete">Delete</button>
    </form>
</div>

</body>
</html>
